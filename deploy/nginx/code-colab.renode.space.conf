# CodeColab - nginx vhost, self-contained.
#
# Two things in the original broke the product:
#
#   1. location / had no WebSocket upgrade headers, so nginx forwarded the
#      handshake as an ordinary GET. FastAPI has no HTTP route at /ws/... and
#      answered 404, which is exactly what the extension reported. Every
#      session failed while the rest of the site looked perfectly healthy.
#
#   2. client_max_body_size defaults to 1 MB. Sharing a workspace PUTs the
#      whole project in one request - up to MAX_SNAPSHOT_BYTES, 25 MB by
#      default - so any real project would have been rejected with 413 the
#      moment the sockets started working.
#
# No `map` directive is used, so nothing outside this file has to change:
# only /ws/ ever upgrades, and in that block "upgrade" is always the right
# answer. (A map is only needed when one block serves both kinds of traffic,
# where hardcoding it would break keep-alive on ordinary requests.)
#
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name code-colab.renode.space;

    # Certificate renewal has to stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:81$request_uri;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name code-colab.renode.space;

    ssl_certificate /srv/server_certs/code-colab.renode.space/cert.pem;
    ssl_certificate_key /srv/server_certs/code-colab.renode.space/key.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers on;

    # A shared workspace is uploaded in one request. Keep this at or above
    # MAX_SNAPSHOT_BYTES in the backend's .env, with room for JSON overhead.
    client_max_body_size 32m;

    # Let the API's own JSON errors through instead of nginx error pages.
    proxy_intercept_errors off;

    location /.well-known/acme-challenge/ {
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:81$request_uri;
    }

    # --- the collaboration socket -----------------------------------------
    location /ws/ {
        proxy_pass http://5.83.153.81:25589;

        # The three lines the original was missing.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A session with nobody typing is idle by definition, and the default
        # 60s would drop it. The client also heartbeats every 25s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- everything else ---------------------------------------------------
    location / {
        proxy_pass http://5.83.153.81:25589;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
