<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ settings.app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css" />
    <link rel="icon" href="/static/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  </head>
  <body>
    {% block chrome %}
    <header class="topbar">
      <a class="brand" href="/admin">
        <img class="brand-logo" src="/static/logo.png" alt="" width="22" height="22" />
        {{ settings.app_name }}
      </a>
      {% if admin %}
      <nav class="topnav">
        <a href="/admin" class="{% block nav_dash %}{% endblock %}">Dashboard</a>
        <a href="/admin/users" class="{% block nav_users %}{% endblock %}">Users</a>
      </nav>
      <form method="post" action="/admin/logout" class="topbar-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
        <span class="who">{{ admin.name }}</span>
        <button type="submit" class="btn btn-ghost">Sign out</button>
      </form>
      {% endif %}
    </header>
    {% endblock %}

    <main class="page">{% block content %}{% endblock %}</main>

    {% block scripts %}{% endblock %}
  </body>
</html>
